name: ScopeBot

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch mempool and write STATUS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 << 'PY'
          import json, os, subprocess, urllib.request
          from datetime import datetime, timezone

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "ScopeBot/1.0"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read().decode())

          fees = get("https://mempool.space/api/v1/fees/recommended")
          pool = get("https://mempool.space/api/mempool")
          now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          fastest = int(fees.get("fastestFee") or 0)
          condition = "congested" if fastest >= 50 else "busy" if fastest >= 8 else "empty" if fastest <= 2 else "calm"
          count = int(pool.get("count") or 0)
          vsize = int(pool.get("vsize") or 0)
          total_fee = int(pool.get("total_fee") or 0)
          payload = {
              "bot": "ScopeBot",
              "updatedAt": now,
              "source": "https://mempool.space",
              "github": "Black-Pope-77-48/satscope-bot",
              "fork": "Black-Pope-77-48/mempool",
              "fees": fees,
              "mempool": {"count": count, "vsize": vsize, "totalFee": total_fee},
              "condition": condition,
          }
          with open("STATUS.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2)
              f.write("\n")
          mvb = vsize / 1e6
          md = f"""# ScopeBot snapshot

Updated `{now}` from [mempool.space](https://mempool.space).

| | |
| --- | --- |
| GitHub | [Black-Pope-77-48/satscope-bot](https://github.com/Black-Pope-77-48/satscope-bot) |
| Fork | [Black-Pope-77-48/mempool](https://github.com/Black-Pope-77-48/mempool) |
| Condition | {condition} |
| Next block | {fees.get("fastestFee")} sat/vB |
| 30 min | {fees.get("halfHourFee")} sat/vB |
| 1 hour | {fees.get("hourFee")} sat/vB |
| Economy | {fees.get("economyFee")} sat/vB |
| Unconfirmed | {count:,} |
| Mempool vsize | {mvb:.1f} MvB |

Posted by ScopeBot.
"""
          with open("STATUS.md", "w", encoding="utf-8") as f:
              f.write(md)
          comment = (
              f"ScopeBot {now} — next block {fastest} sat/vB ({condition}), "
              f"{count:,} unconfirmed. Source: mempool.space"
          )
          open("/tmp/scopebot-comment.txt", "w", encoding="utf-8").write(comment)
          print(comment)
          PY
          git config user.name "ScopeBot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.json STATUS.md
          if git diff --cached --quiet; then
            echo "No STATUS change"
          else
            git commit -m "chore: mempool snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
          COMMENT=$(cat /tmp/scopebot-comment.txt)
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Black-Pope-77-48/satscope-bot/issues/1/comments \
            -d "$(python3 -c 'import json,sys; print(json.dumps({"body": open("/tmp/scopebot-comment.txt").read()}))')"
